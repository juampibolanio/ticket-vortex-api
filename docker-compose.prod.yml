services:
  ticketvortex-prod-db:
    image: postgres:18-alpine
    container_name: ticketvortex-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketvortex-net

  ticketvortex-prod-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketvortex-prod-api
    restart: always
    depends_on:
      ticketvortex-prod-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://ticketvortex-prod-db:5432/${DB_NAME}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - ticketvortex-net

volumes:
  postgres_prod_data:

networks:
  ticketvortex-net:
    driver: bridge
