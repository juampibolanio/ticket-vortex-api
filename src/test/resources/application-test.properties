# ==============================================================================
# TicketVortex API - Test Profile (test)
# ==============================================================================
spring.application.name=ticketvortexapi
spring.jackson.time-zone=UTC

# In-Memory Database for fast automated testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Self-contained JWT secret for tests (independent of external .env)
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration=3600000
security.jwt.renew-time=604800000

# CORS settings for tests
cors.allowed-origins=http://localhost:3000