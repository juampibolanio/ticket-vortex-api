# ==============================================================================
# TicketVortex API - Development Profile (dev)
# ==============================================================================

# JPA / Hibernate: Debugging and SQL formatting
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Connection Pool (HikariCP - Development defaults)
spring.datasource.hikari.pool-name=TicketVortex-HikariCP-Dev
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Logging Configuration for Development
logging.level.root=INFO
logging.level.com.chacuio.ticketvortexapi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger / OpenAPI: Always enabled in Development
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
