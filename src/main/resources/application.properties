# ==============================================================================
# TicketVortex API - Base Application Configuration
# ==============================================================================

# Core Application Settings
spring.application.name=ticketvortexapi
server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=UTC

# Import environment variables from .env file (if present in working directory)
spring.config.import=optional:file:.env[.properties]

# Active Spring Profile: reads from SPRING_PROFILES_ACTIVE in .env / system env, defaults to 'dev'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================================================================
# Database Base Configuration (PostgreSQL)
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway Migrations (manages database schema across all environments)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:3600000}
security.jwt.renew-time=${JWT_RENEW_TIME:604800000}

# ==============================================================================
# CORS Configuration
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
