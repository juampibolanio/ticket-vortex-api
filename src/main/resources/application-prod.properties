# ==============================================================================
# TicketVortex API - Production Profile (prod)
# ==============================================================================

# JPA / Hibernate: Optimized for performance and security (no SQL leakage in logs)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool (HikariCP - Tuned for high-concurrency production load)
spring.datasource.hikari.pool-name=TicketVortex-HikariCP-Prod
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Flyway Production Safeguards
spring.flyway.validate-on-migrate=true

# Logging Configuration for Production
logging.level.root=WARN
logging.level.com.chacuio.ticketvortexapi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Swagger / OpenAPI: Disabled by default in production, can be toggled via SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
