services:
  ticketvortex-db:
    image: postgres:18-alpine
    container_name: ticket-vortex-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ticketvortexdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ticketvortexdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: